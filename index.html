<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PS4 Ormoc Jailbreaker</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #0b0d10;
  color: #c8ced8;
  font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
}
#brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px 15px;
  background: linear-gradient(180deg, #10141d 0%, var(--bg-main, #0b0d10) 100%);
  border-bottom: 1px solid var(--bg-accent, #1e2732);
}
#brand img {
  width: 160px;
  height: 48px;
  object-fit: contain;
}
#brand b {
  font-size: 40px;
  font-weight: 800;
  letter-spacing: .08em;
  color: var(--text-primary, #ffffff);
  text-transform: uppercase;
  background: linear-gradient(90deg, #ffffff 0%, #a3b3cc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
/* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
#spin {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 140px;
  height: 140px;
  margin: -74px 0 0 -74px; /* Centered layout offset balancing border thickness */
  border: 4px solid #1e2732;
  border-top-color: #7fd0a0;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  display: block;
  z-index: 1; /* Keeps the spinner behind the hollow button interactive field */
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
#msg {
  position: fixed;
  top: 50%;
  left: 0;
  right: 0;
  transform: translateY(-50%);
  text-align: center;
  font-size: 16px;
  letter-spacing: 0.5px;
  display: none;
}
#wrap {
  padding: 0;
}
#state, #out {
  display: none;
}
body.done #spin {
  display: none;
}
body.fail #spin {
  display: none;
}
body.fail #msg {
  display: block;
}
/* ?log=1 -- the full step log, styled like the landing. */
body.log #spin, body.log #msg, body.log .jb-button { 
  display: none; 
}

/* CENTERED LOG CONTAINER */
#wrap { 
  position: fixed;
  top: 75%;                 /* Placed safely below the 42% button zone */
  left: 0;
  right: 0;
  text-align: center;
  box-sizing: border-box;
  padding: 0 18px;
}

#state { font-size: 22px; font-weight: 700; margin: 0 0 8px; display: block; }
#det { font-size: 20px; color: #8b95a3; margin: 0 0 6px; }
#det b { color: #c8ced8; font-weight: 600; }
#cache { font-size: 20px; color: #5c6672; margin: 0 0 10px; min-height: 14px; }
#cache.cacheok { color: #7fd0a0; }
.ok { color: #7fd0a0; }
.bad { color: #d08a7f; }
.warn { color: #d8c07f; }
.safe { color: #7fd0a0; }
.danger { color: #d08a7f; }
code { color: #9fb3d0; }

/* FIXED CONTACT BOX STYLING */
.contact-box {
  position: fixed;
  bottom: 30px; 
  left: 0;
  right: 0;
  text-align: center;
  z-index: 10; 
}
.contact-number {
  font-size: 20px;
  font-weight: 800;
  color: #7fd0a0; 
  letter-spacing: 0.5px;
  background: #11151b; 
  display: inline-block;
  padding: 8px 16px;
  border: 1px solid #1e2732;
  border-radius: 20px;
}
body.log .contact-box {
  display: none;
}

/* CENTERED BUTTON AREA */
.jb-button {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%); 
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 3px dashed #3bd8ff; /* Swapped to dashed line style for transparency aesthetic */
  background: transparent;    /* Renders center background clear to view spinner elements */
  color: #ffffff;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: inset 0 0 15px rgba(0, 191, 255, 0.1), 0 0 10px #00bfff;
  z-index: 2; /* Sits layered above the spinner so click registers cleanly */
  outline: none;
}
.jb-button:hover {
  box-shadow: inset 0 0 20px rgba(0, 216, 255, 0.2), 0 0 14px #00d8ff;
  border-color: #00d8ff;
}
.jb-button:disabled {
  border-color: rgba(30, 39, 50, 0.5);
  box-shadow: none;
  cursor: default;
}
</style>
</head>
<body>

  <div id="brand"> 
    <img src="logo_raw.png" alt="" width="28" height="28">
  </div>
  <div id="brand">
    <b>Ormoc Gaming Console Repair</b>
  </div>

  <div id="spin"></div>
  <div id="msg">Restart your console</div>

  <div id="wrap">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
    <div id="out"></div>
  </div>

  <button id="jeilbrek" class="jb-button" type="button">
    <span class="power-icon"></span>
  </button> 

  <div class="contact-box">
    <div class="contact-number">Contact: Fb : Aladin F. Toel 09066876054</div>
  </div>
  
<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    // FIXED: Target changed back to jb.html to stop the infinite reloading loop crash
    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run", function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading", function () { 
            setCache("caching for offline (first run)..."); 
        }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
            }
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run", function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE ERROR -- press X or tap to run anyway", go);
        }, false);
        // FIXED: Safely closed the obsolete events block that was cutting off the script execution
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            go();
        }, false);
    }
})();
</script>


</body>
</html>
